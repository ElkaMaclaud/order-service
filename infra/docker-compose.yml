name: order-processing

services:
  orders-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_DB: orders
      POSTGRES_PASSWORD_FILE: /run/secrets/orders_db_password
    secrets:
      - orders_db_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  orders_db_password:
    file: ./secrets/orders_db_password.txt

volumes:
  orders-db-data: